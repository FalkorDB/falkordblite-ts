name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Build valkey-server (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          VALKEY_VERSION=9.1.3
          sudo apt-get update
          sudo apt-get install -y libgomp1
          curl --fail --location --silent --show-error \
            -o "valkey-${VALKEY_VERSION}.tar.gz" \
            "https://github.com/valkey-io/valkey/archive/refs/tags/${VALKEY_VERSION}.tar.gz"
          tar xzf "valkey-${VALKEY_VERSION}.tar.gz"
          cd "valkey-${VALKEY_VERSION}"
          make valkey-server -j"$(nproc)"
          sudo install -m 0755 src/valkey-server /usr/local/bin/valkey-server

      - name: Install valkey-server and dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install valkey libomp

      - name: Verify valkey-server version
        run: valkey-server --version

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Download FalkorDB binaries
        run: node scripts/postinstall.js

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --coverage

      - name: Upload coverage
        if: matrix.node-version == 22 && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: coverage
          flags: unittests
          name: codecov-falkordblite-ts
          fail_ci_if_error: false
