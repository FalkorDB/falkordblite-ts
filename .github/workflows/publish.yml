name: Publish

on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Build valkey-server and install dependencies
        run: |
          set -euo pipefail
          VALKEY_VERSION=9.1.3
          sudo apt-get update
          sudo apt-get install -y libgomp1
          curl --fail --location --silent --show-error \
            -o "valkey-${VALKEY_VERSION}.tar.gz" \
            "https://github.com/valkey-io/valkey/archive/refs/tags/${VALKEY_VERSION}.tar.gz"
          tar xzf "valkey-${VALKEY_VERSION}.tar.gz"
          cd "valkey-${VALKEY_VERSION}"
          make valkey-server -j"$(nproc)"
          sudo install -m 0755 src/valkey-server /usr/local/bin/valkey-server

      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Download FalkorDB binaries
        run: node scripts/postinstall.js

      - name: Test
        run: npm test

      - name: Clean platform-specific binaries before publish
        run: rm -rf bin/

      - name: Set version from Git tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting version to $VERSION"
          npm version "$VERSION" --no-git-tag-version

      - name: Publish to npm
        run: npm publish --provenance --access public
