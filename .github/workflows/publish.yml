name: Publish

on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Verify platform packages are published
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const optionalDependencies = require('./package.json').optionalDependencies ?? {};
          const packages = ['@falkordblite/linux-x64', '@falkordblite/darwin-arm64'];

          for (const name of packages) {
            const version = optionalDependencies[name];
            if (!version) {
              console.error(`Missing pinned optional dependency: ${name}`);
              process.exit(1);
            }
            try {
              const publishedVersion = execFileSync(
                'npm',
                ['view', `${name}@${version}`, 'version'],
                { encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'] },
              ).trim();
              if (publishedVersion !== version) {
                console.error(`Registry returned ${publishedVersion} for ${name}@${version}`);
                process.exit(1);
              }
              console.log(`Verified ${name}@${version} is published.`);
            } catch (error) {
              const detail = error.stderr?.toString().trim();
              console.error(`Required platform package ${name}@${version} is not available.`);
              if (detail) console.error(detail);
              process.exit(1);
            }
          }
          NODE

      - name: Install redis-server and dependencies
        run: |
          curl -fsSL https://packages.redis.io/gpg | sudo gpg --dearmor -o /usr/share/keyrings/redis-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/redis-archive-keyring.gpg] https://packages.redis.io/deb $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/redis.list
          sudo apt-get update
          sudo apt-get install -y redis-server libgomp1

      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Download FalkorDB binaries
        run: node scripts/postinstall.js

      - name: Test
        run: npm test

      - name: Clean platform-specific binaries before publish
        run: rm -rf bin/

      - name: Set version from Git tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting version to $VERSION"
          npm version "$VERSION" --no-git-tag-version

      - name: Publish to npm
        run: npm publish --provenance --access public
