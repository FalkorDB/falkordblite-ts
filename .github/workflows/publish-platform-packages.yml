name: Publish Platform Packages

on:
  workflow_dispatch:
    inputs:
      redis_version:
        description: 'Redis version to build'
        required: true
        default: '8.10.3'
      falkordb_version:
        description: 'FalkorDB release tag'
        required: true
        default: 'v6.2.0'

jobs:
  build-and-publish:
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            falkordb_asset: falkordb-x64.so
          - os: macos-latest
            platform: darwin-arm64
            falkordb_asset: falkordb-macos-arm64v8.so
    runs-on: ${{ matrix.os }}
    env:
      REDIS_VERSION: ${{ inputs.redis_version }}
      FALKORDB_VERSION: ${{ inputs.falkordb_version }}
      PLATFORM: ${{ matrix.platform }}
      FALKORDB_ASSET: ${{ matrix.falkordb_asset }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Validate version inputs
        run: |
          set -euo pipefail
          if [[ ! "${REDIS_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid redis_version: ${REDIS_VERSION}" >&2
            exit 1
          fi
          IFS=. read -r redis_major _ _ <<<"${REDIS_VERSION}"
          if (( redis_major < 8 )); then
            echo "redis_version must be >= 8.0.0 (got ${REDIS_VERSION})" >&2
            exit 1
          fi
          if [[ ! "${FALKORDB_VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid falkordb_version: ${FALKORDB_VERSION} (expected vX.Y.Z)" >&2
            exit 1
          fi
          IFS=. read -r fdb_major fdb_minor _ <<<"${FALKORDB_VERSION#v}"
          if (( fdb_major < 6 || (fdb_major == 6 && fdb_minor < 2) )); then
            echo "falkordb_version must be >= v6.2.0 (got ${FALKORDB_VERSION})" >&2
            exit 1
          fi

      - name: Build Redis from source
        run: |
          set -euo pipefail
          REDIS_TARBALL="redis-${REDIS_VERSION}.tar.gz"

          curl --fail --location --silent --show-error \
            -o "${REDIS_TARBALL}" \
            "https://github.com/redis/redis/archive/refs/tags/${REDIS_VERSION}.tar.gz"

          tar xzf "${REDIS_TARBALL}"
          cd "redis-${REDIS_VERSION}"
          make redis-server -j"$(getconf _NPROCESSORS_ONLN)"
          mkdir -p "$GITHUB_WORKSPACE/packages/${PLATFORM}/bin"
          cp src/redis-server "$GITHUB_WORKSPACE/packages/${PLATFORM}/bin/"
          chmod +x "$GITHUB_WORKSPACE/packages/${PLATFORM}/bin/redis-server"

      - name: Download FalkorDB module
        run: |
          set -euo pipefail
          FALKORDB_DIR="packages/${PLATFORM}/bin"
          mkdir -p "${FALKORDB_DIR}"
          FALKORDB_SO="${FALKORDB_DIR}/falkordb.so"

          curl --fail --location --silent --show-error \
            -o "${FALKORDB_SO}" \
            "https://github.com/FalkorDB/FalkorDB/releases/download/${FALKORDB_VERSION}/${FALKORDB_ASSET}"

          chmod +x "${FALKORDB_SO}"

      - name: Verify redis-server
        run: |
          set -euo pipefail
          version="$(./packages/${PLATFORM}/bin/redis-server --version)"
          echo "$version"
          [[ "$version" == "Redis server v=${REDIS_VERSION} "* ]]

      - name: Generate license files and NOTICE
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ./packages/update-license-files.sh "${REDIS_VERSION}" "${FALKORDB_VERSION}" "${PLATFORM}"
          cat "packages/${PLATFORM}/NOTICE"

      - name: Update npm
        run: npm install -g npm@latest

      - name: Set package version
        run: |
          set -euo pipefail
          cd "packages/${PLATFORM}"
          # Derive version from Redis and FalkorDB versions
          # The license.1 suffix is a repackaging revision, not a binary version change.
          FALKORDB_VERSION_CLEAN="${FALKORDB_VERSION#v}"
          PACKAGE_VERSION="${REDIS_VERSION}-falkordb.${FALKORDB_VERSION_CLEAN}-license.1"
          npm version "${PACKAGE_VERSION}" --no-git-tag-version

      - name: Verify package contents
        run: |
          set -euo pipefail
          cd "packages/${PLATFORM}"
          contents="$(npm pack --dry-run --json | node -e 'const p=JSON.parse(require("fs").readFileSync(0,"utf8"))[0]; console.log(p.files.map(f=>f.path).join("\n"))')"
          echo "$contents"
          for f in bin/redis-server bin/falkordb.so LICENSE LICENSE-REDIS.txt REDISCONTRIBUTIONS.txt LICENSE-FALKORDB LICENSE-SSPL LICENSE-AGPL LICENSE-FALKORDB-SSPL LICENSE-FALKORDB-AGPL THIRD-PARTY-NOTICES.txt NOTICE; do
            grep -qx "$f" <<<"$contents" || { echo "Missing $f in package"; exit 1; }
          done
          grep -q "Redis ${REDIS_VERSION}" NOTICE
          grep -q "FalkorDB ${FALKORDB_VERSION}" NOTICE
          for marker in \
            "REDISCONTRIBUTIONS.txt" \
            "Lua CJSON" \
            "Lua BitOp" \
            "Marc Alexander Lehmann" \
            "libuv" \
            "s2geometry" \
            "ScalableVectorSearch" \
            "FalkorDB Rust crate: rquickjs " \
            "quickjs/LICENSE" \
            "Fabrice Bellard" \
            "Rust standard library bundled by RediSearch (LICENSE-APACHE)" \
            "Rust standard library bundled by RediSearch (LICENSE-MIT)" \
            "The Rust Project Contributors" \
            "COPYRIGHT-library.html" \
            "Copyright notices for The Rust Standard Library" \
            "Out-of-tree dependencies" \
            "aho-corasick-1.1.4" \
            "FalkorDB Rust crate: lazy_static " \
            "FalkorDB Rust crate: roaring "
          do
            grep -q "$marker" THIRD-PARTY-NOTICES.txt || { echo "Missing notice marker: $marker" >&2; exit 1; }
          done

      - name: Publish
        run: |
          cd "packages/${PLATFORM}"
          npm publish --access public --tag next --provenance
