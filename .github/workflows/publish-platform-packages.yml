name: Publish Platform Packages

on:
  workflow_dispatch:
    inputs:
      valkey_version:
        description: 'Valkey version to build'
        required: true
        default: '9.1.3'
      falkordb_version:
        description: 'FalkorDB release tag'
        required: true
        default: 'v4.18.3'

jobs:
  build-and-publish:
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            falkordb_asset: falkordb-x64.so
          - os: macos-latest
            platform: darwin-arm64
            falkordb_asset: falkordb-macos-arm64v8.so
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Build Valkey from source
        run: |
          set -euo pipefail
          VALKEY_TARBALL="valkey-${{ inputs.valkey_version }}.tar.gz"

          curl --fail --location --silent --show-error \
            -o "${VALKEY_TARBALL}" \
            "https://github.com/valkey-io/valkey/archive/refs/tags/${{ inputs.valkey_version }}.tar.gz"

          tar xzf "${VALKEY_TARBALL}"
          cd "valkey-${{ inputs.valkey_version }}"
          make valkey-server -j$(command -v nproc >/dev/null 2>&1 && nproc || sysctl -n hw.ncpu)
          mkdir -p "$GITHUB_WORKSPACE/packages/${{ matrix.platform }}/bin"
          cp src/valkey-server "$GITHUB_WORKSPACE/packages/${{ matrix.platform }}/bin/"
          chmod +x "$GITHUB_WORKSPACE/packages/${{ matrix.platform }}/bin/valkey-server"

      - name: Download FalkorDB module
        run: |
          set -euo pipefail
          FALKORDB_DIR="packages/${{ matrix.platform }}/bin"
          mkdir -p "${FALKORDB_DIR}"
          FALKORDB_SO="${FALKORDB_DIR}/falkordb.so"
          FALKORDB_ASSET="${{ matrix.falkordb_asset }}"

          curl --fail --location --silent --show-error \
            -o "${FALKORDB_SO}" \
            "https://github.com/FalkorDB/FalkorDB/releases/download/${{ inputs.falkordb_version }}/${FALKORDB_ASSET}"

          chmod +x "${FALKORDB_SO}"

      - name: Verify valkey-server
        run: ./packages/${{ matrix.platform }}/bin/valkey-server --version

      - name: Update npm
        run: npm install -g npm@latest

      - name: Set package version
        run: |
          cd "packages/${{ matrix.platform }}"
          # Derive version from Valkey and FalkorDB versions
          # Valkey 9.1.3 + FalkorDB v4.18.3 -> 9.1.3-falkordb.4.18.3
          FALKORDB_VERSION="${{ inputs.falkordb_version }}"
          FALKORDB_VERSION_CLEAN="${FALKORDB_VERSION#v}"
          PACKAGE_VERSION="${{ inputs.valkey_version }}-falkordb.${FALKORDB_VERSION_CLEAN}"
          npm version "${PACKAGE_VERSION}" --no-git-tag-version

      - name: Publish
        run: |
          cd "packages/${{ matrix.platform }}"
          npm publish --access public --tag next --provenance
