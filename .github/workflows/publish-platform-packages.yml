name: Publish Platform Packages

on:
  workflow_dispatch:
    inputs:
      redis_version:
        description: 'Redis version to build'
        required: true
        default: '8.10.3'
      falkordb_version:
        description: 'FalkorDB release tag'
        required: true
        default: 'v6.2.0'

jobs:
  build-and-publish:
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            falkordb_asset: falkordb-x64.so
          - os: macos-latest
            platform: darwin-arm64
            falkordb_asset: falkordb-macos-arm64v8.so
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Build Redis from source
        run: |
          set -euo pipefail
          REDIS_TARBALL="redis-${{ inputs.redis_version }}.tar.gz"

          curl --fail --location --silent --show-error \
            -o "${REDIS_TARBALL}" \
            "https://github.com/redis/redis/archive/refs/tags/${{ inputs.redis_version }}.tar.gz"

          tar xzf "${REDIS_TARBALL}"
          cd "redis-${{ inputs.redis_version }}"
          make redis-server -j"$(getconf _NPROCESSORS_ONLN)"
          mkdir -p "$GITHUB_WORKSPACE/packages/${{ matrix.platform }}/bin"
          cp src/redis-server "$GITHUB_WORKSPACE/packages/${{ matrix.platform }}/bin/"
          chmod +x "$GITHUB_WORKSPACE/packages/${{ matrix.platform }}/bin/redis-server"

      - name: Download FalkorDB module
        run: |
          set -euo pipefail
          FALKORDB_DIR="packages/${{ matrix.platform }}/bin"
          mkdir -p "${FALKORDB_DIR}"
          FALKORDB_SO="${FALKORDB_DIR}/falkordb.so"
          FALKORDB_ASSET="${{ matrix.falkordb_asset }}"

          curl --fail --location --silent --show-error \
            -o "${FALKORDB_SO}" \
            "https://github.com/FalkorDB/FalkorDB/releases/download/${{ inputs.falkordb_version }}/${FALKORDB_ASSET}"

          chmod +x "${FALKORDB_SO}"

      - name: Verify redis-server
        env:
          EXPECTED_REDIS_VERSION: ${{ inputs.redis_version }}
        run: |
          set -euo pipefail
          version="$(./packages/${{ matrix.platform }}/bin/redis-server --version)"
          echo "$version"
          [[ "$version" == "Redis server v=${EXPECTED_REDIS_VERSION} "* ]]

      - name: Generate license files and NOTICE
        env:
          REDIS_VERSION: ${{ inputs.redis_version }}
          FALKORDB_VERSION: ${{ inputs.falkordb_version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          ./packages/update-license-files.sh "${REDIS_VERSION}" "${FALKORDB_VERSION}" "${PLATFORM}"
          cat "packages/${PLATFORM}/NOTICE"

      - name: Update npm
        run: npm install -g npm@latest

      - name: Set package version
        run: |
          cd "packages/${{ matrix.platform }}"
          # Derive version from Redis and FalkorDB versions
          # Redis 8.10.3 + FalkorDB v6.2.0 -> 8.10.3-falkordb.6.2.0
          FALKORDB_VERSION="${{ inputs.falkordb_version }}"
          FALKORDB_VERSION_CLEAN="${FALKORDB_VERSION#v}"
          PACKAGE_VERSION="${{ inputs.redis_version }}-falkordb.${FALKORDB_VERSION_CLEAN}"
          npm version "${PACKAGE_VERSION}" --no-git-tag-version

      - name: Verify package contents
        run: |
          set -euo pipefail
          cd "packages/${{ matrix.platform }}"
          contents="$(npm pack --dry-run --json | node -e 'const p=JSON.parse(require("fs").readFileSync(0,"utf8"))[0]; console.log(p.files.map(f=>f.path).join("\n"))')"
          echo "$contents"
          for f in bin/redis-server bin/falkordb.so LICENSE LICENSE-REDIS.txt LICENSE-FALKORDB LICENSE-FALKORDB-SSPL LICENSE-FALKORDB-AGPL NOTICE; do
            grep -qx "$f" <<<"$contents" || { echo "Missing $f in package"; exit 1; }
          done

      - name: Publish
        run: |
          cd "packages/${{ matrix.platform }}"
          npm publish --access public --tag next --provenance
